<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <link rel="icon" type="image/x-icon" href="/favicon.ico" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#171717" />
    <meta
      name="description"
      content="NocoBase administration console"
    />
    <meta
      data-rh="true"
      property="og:image"
      content="/logo-mark.png"
    />
    <meta
      data-rh="true"
      name="twitter:image"
      content="/logo-mark.png"
    />
    <style>
      .portal-bootstrap-loading {
        display: flex;
        min-height: 100svh;
        width: 100%;
        align-items: center;
        justify-content: center;
        background: oklch(0.985 0 0);
        color: oklch(0.18 0 0);
      }

      .portal-bootstrap-loading svg {
        width: 1.75rem;
        height: 1.75rem;
        animation: portal-bootstrap-spin 1s linear infinite;
      }

      html,
      body {
        margin: 0;
      }

      @keyframes portal-bootstrap-spin {
        to {
          transform: rotate(360deg);
        }
      }

      @media (prefers-reduced-motion: reduce) {
        .portal-bootstrap-loading svg {
          animation: none;
        }
      }
    </style>
    <title>NocoBase</title>
  </head>
  <body>
    <noscript>You need to enable JavaScript to run this app.</noscript>
    <div id="root">
      <div
        class="portal-bootstrap-loading"
        role="status"
        aria-label="Loading application"
      >
        <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
          <path
            d="M21 12a9 9 0 1 1-6.219-8.56"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
          />
        </svg>
      </div>
    </div>
    <script type="module" src="/src/index.tsx"></script>

</html>
