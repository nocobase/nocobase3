<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Files route E2E</title>
  </head>
  <body>
    <div id="root"></div>
    <script>
      const marker = '/e2e/';
      const markerIndex = window.location.pathname.indexOf(marker);
      window.NOCOBASE_PORTAL_BASE =
        markerIndex < 0
          ? '/'
          : `${window.location.pathname.slice(0, markerIndex)}/`;
    </script>
    <script type="module" src="./files-routes-page.tsx"></script>
  </body>
</html>
