#   publicOrigin: https://apps.example.com

database:
  connections:
    main:
      dialect: sqlite
      # SQLite file location.
#       filename: /data/database.sqlite
# For PostgreSQL, set dialect to postgres and configure the connection below.
#       host: db.internal
