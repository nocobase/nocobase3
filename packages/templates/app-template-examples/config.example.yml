# Copy this file to config.yml before starting the application.

# app:
#   Public origin used for callbacks and redirects in production.
#   publicOrigin: https://apps.example.com

# The language the application starts in, for the browser and the server alike. Which languages it offers follows
# from the files in client/locales and server/locales, not from configuration.
# i18n:
#   defaultLocale: zh-CN

# Values under client are public and embedded in the SPA HTML.
client:
  app:
    title: NocoBase Examples
    # Defaults apply only when no valid browser-local choice is saved.
    # defaultColorScheme: system # light | dark | system
    # defaultTheme: compact # ID from client/theme/theme-presets.ts

auth:
  # Generate a unique secret, for example with: openssl rand -hex 32
  secret: replace-with-a-unique-secret
  emailAndPassword:
    enabled: true
    autoSignIn: false
  session:
    storeSessionInDatabase: true

session:
  # Use the same generated value as auth.secret, or another unique secret.
  secret: replace-with-a-unique-secret

notification:
  channels:
    - type: in-app
      enabled: true
      providers:
        - type: database
          name: default

    # Uncomment and configure this channel to send email notifications.
    # - type: email
    #   enabled: true
    #   providers:
    #     - type: smtp
    #       name: smtp
    #       host: smtp.example.com
    #       port: 587
    #       secure: false
    #       auth:
    #         user: mailer@example.com
    #         pass: replace-with-the-smtp-password
    #       from: NocoBase <mailer@example.com>
    #
    #     - type: resend
    #       name: resend
    #       apiKey: replace-with-the-resend-api-key
    #       from: NocoBase <notifications@example.com>

    # Uncomment and configure this channel to send IM notifications.
    # - type: im
    #   enabled: true
    #   providers:
    #     - type: feishu-webhook
    #       name: feishu
    #       webhookUrl: https://open.feishu.cn/open-apis/bot/v2/hook/replace-me
    #       secret: replace-with-the-feishu-secret
    #
    #     - type: dingtalk-webhook
    #       name: dingtalk
    #       webhookUrl: https://oapi.dingtalk.com/robot/send?access_token=replace-me
    #       secret: replace-with-the-dingtalk-secret

# Declarative LLM services are loaded from application config.
# Reload application config after editing; no process restart or AI resource rescan is required.
# ai:
#   llmServices:
#     - name: openai
#       title: OpenAI
#       provider: openai
#       options:
#         apiKey: ${OPENAI_API_KEY}
#       enabledModels:
#         - label: GPT-4.1
#           value: gpt-4.1
#       enabled: true
#       sort: 10

database:
  default: main
  connections:
    main:
      dialect: sqlite
      database: database.sqlite
      debug: false
      # For Oracle, use dialect: oracle and replace database with serviceName: FREEPDB1.
      # For SQL Server, use dialect: mssql and configure encrypt and trustServerCertificate.
      schemaManagement: managed
      migrations:
        autoRun: true
      seeds:
        autoRun: true
    # Application-owned analytics examples; also supplied as application defaults.
    # Sources live in database/analytics/{migrations,seeds}.
    analytics:
      dialect: sqlite
      database: analytics.sqlite
      schemaManagement: managed
      migrations:
        autoRun: true
      seeds:
        autoRun: true
    # An existing database another system owns: NocoBase reads its schema and never changes it, and no
    # migrations or seeds run against it. Titles, descriptions and relations the schema cannot express are
    # read from database/<connection>/collections/<name>/metadata.json — edit those files and rerun
    # `pnpm collections:generate`. The externalCrm connection in server/config/database.ts is the example;
    # point it at the real database here to replace the SQLite stand-in.
    # externalCrm:
    #   dialect: postgres
    #   host: crm.internal
    #   database: crm
    #   username: crm_reader
    #   password: ${CRM_DATABASE_PASSWORD}
    #   schemaManagement: external
    #   naming: { underscored: true, tablePrefix: crm_ }
    #   # Optional: read metadata from another collections directory instead of this connection's own.
    #   # metadataStore: database/shared-crm/collections

snowflake:
  # Assign a unique worker ID to each concurrently running instance.
  workerId: 0
  epoch: 1605024000

# File logging is independent of terminal formatting.
logging:
  level: info
  file:
    enabled: true
    retentionDays: 7
    name: app
    maxFileSizeMB: 10
    maxTotalSizeMB: 500
  loggers:
    request:
      file:
        name: request
  console:
    enabled: true
    # Set true for human-readable terminal output.
    pretty: false
