services:
  oceanbase:
    image: oceanbase/oceanbase-ce:4.4.2-lts
    init: true
    restart: 'no'
    ports:
      - '0:2881'
    environment:
      MODE: mini
      OB_TENANT_NAME: test
      OB_SYS_PASSWORD: 'ObSys_123456'
      OB_TENANT_PASSWORD: ${OCEANBASE_PASSWORD:-ObTest_123456}
      OB_MEMORY_LIMIT: 6G
      OB_SYSTEM_MEMORY: 1G
      OB_DATAFILE_SIZE: 5G
      OB_LOG_DISK_SIZE: 5G
      OB_DATABASE: nocobase_collection_builder
    mem_limit: 8g
    stop_grace_period: 30s
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          obclient -h127.0.0.1 -P2881
          -u"root@$${OB_TENANT_NAME}"
          -p"$${OB_TENANT_PASSWORD}"
          -e 'select 1' >/dev/null 2>&1
      interval: 15s
      timeout: 10s
      start_period: 5m
      retries: 20
