services:
  dameng:
    image: xuxuclassmate/dameng:latest
    platform: linux/amd64
    ports:
      - '0:5236'
    environment:
      INSTANCE_NAME: instance
      SYSDBA_PWD: SYSDBA001
      PAGE_SIZE: '8'
      CASE_SENSITIVE: '1'
      UNICODE_FLAG: '0'
      LENGTH_IN_CHAR: '0'
    healthcheck:
      test: ['CMD-SHELL', 'bash -c "</dev/tcp/127.0.0.1/5236"']
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s

  dameng-init:
    image: xuxuclassmate/dameng:latest
    platform: linux/amd64
    depends_on:
      dameng:
        condition: service_healthy
    environment:
      SYSDBA_PWD: SYSDBA001
      NOCOBASE_PWD: NocoBase_Dameng_2026
    entrypoint:
      - /bin/bash
      - -c
    command:
      - >-
        set -eu;
        export LD_LIBRARY_PATH=/opt/dmdbms/bin;
        /opt/dmdbms/bin/disql -L -S
        "SYSDBA/$${SYSDBA_PWD}@dameng:5236"
        -e "select 1" >/dev/null;
        if ! /opt/dmdbms/bin/disql -L -S
        "SYSDBA/$${SYSDBA_PWD}@dameng:5236"
        -e "select username from dba_users where username = 'NOCOBASE'"
        | grep -q NOCOBASE; then
        printf "create user NOCOBASE identified by %s;\ngrant RESOURCE to NOCOBASE;\n"
        "$${NOCOBASE_PWD}" |
        /opt/dmdbms/bin/disql -L -S
        "SYSDBA/$${SYSDBA_PWD}@dameng:5236";
        fi
