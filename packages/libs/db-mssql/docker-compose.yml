services:
  mssql:
    image: mcr.microsoft.com/mssql/server:2022-latest
    platform: linux/amd64
    ports:
      - '0:1433'
    environment:
      ACCEPT_EULA: 'Y'
      MSSQL_PID: Developer
      MSSQL_SA_PASSWORD: NocoBase_Mssql_2026
    healthcheck:
      test:
        [
          'CMD-SHELL',
          '/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P "$$MSSQL_SA_PASSWORD" -Q "SELECT 1" -C',
        ]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s

  mssql-init:
    image: mcr.microsoft.com/mssql/server:2022-latest
    platform: linux/amd64
    depends_on:
      mssql:
        condition: service_healthy
    environment:
      MSSQL_SA_PASSWORD: NocoBase_Mssql_2026
    command:
      - /bin/bash
      - -c
      - >-
        /opt/mssql-tools18/bin/sqlcmd
        -S mssql -U sa -P "$$MSSQL_SA_PASSWORD" -C
        -Q "IF DB_ID(N'nocobase_collection_builder') IS NULL CREATE DATABASE nocobase_collection_builder"
