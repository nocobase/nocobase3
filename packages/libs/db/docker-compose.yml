services:
  postgres:
    image: postgres:16-alpine
    ports:
      - '15432:5432'
    environment:
      POSTGRES_USER: nocobase
      POSTGRES_PASSWORD: nocobase
      POSTGRES_DB: nocobase_collection_builder
    healthcheck:
      test:
        ['CMD-SHELL', 'pg_isready -U nocobase -d nocobase_collection_builder']
      interval: 5s
      timeout: 5s
      retries: 20

  mysql:
    image: mysql:8.4
    ports:
      - '13306:3306'
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_USER: nocobase
      MYSQL_PASSWORD: nocobase
      MYSQL_DATABASE: nocobase_collection_builder
    healthcheck:
      test:
        [
          'CMD-SHELL',
          'mysqladmin ping -h 127.0.0.1 -unocobase -pnocobase --silent',
        ]
      interval: 5s
      timeout: 5s
      retries: 30

  oracle:
    image: gvenzl/oracle-free:23-slim-faststart
    ports:
      - '11521:1521'
    environment:
      ORACLE_PASSWORD: nocobase
      APP_USER: nocobase
      APP_USER_PASSWORD: nocobase
    healthcheck:
      test: ['CMD-SHELL', 'healthcheck.sh']
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 90s

  mssql:
    image: mcr.microsoft.com/mssql/server:2022-latest
    platform: linux/amd64
    ports:
      - '11433:1433'
    environment:
      ACCEPT_EULA: 'Y'
      MSSQL_PID: Developer
      MSSQL_SA_PASSWORD: NocoBase_Mssql_2026
    healthcheck:
      test:
        [
          'CMD-SHELL',
          '/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P "$$MSSQL_SA_PASSWORD" -Q "SELECT 1" -C',
        ]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s

  mssql-init:
    image: mcr.microsoft.com/mssql/server:2022-latest
    platform: linux/amd64
    depends_on:
      mssql:
        condition: service_healthy
    environment:
      MSSQL_SA_PASSWORD: NocoBase_Mssql_2026
    command:
      - /bin/bash
      - -c
      - >-
        /opt/mssql-tools18/bin/sqlcmd
        -S mssql -U sa -P "$$MSSQL_SA_PASSWORD" -C
        -Q "IF DB_ID(N'nocobase_collection_builder') IS NULL CREATE DATABASE nocobase_collection_builder"
