services:
  oceanbase:
    image: oceanbase/oceanbase-ce:4.2.1_bp4
    platform: linux/amd64
    ports:
      - '0:2881'
    environment:
      MODE: mini
      OB_TENANT_NAME: test
    healthcheck:
      test:
        [
          'CMD-SHELL',
          "obclient -h127.0.0.1 -P2881 -uroot@test -e 'select 1' >/dev/null 2>&1",
        ]
      interval: 10s
      timeout: 10s
      retries: 60

  oceanbase-init:
    image: oceanbase/oceanbase-ce:4.2.1_bp4
    platform: linux/amd64
    depends_on:
      oceanbase:
        condition: service_healthy
    entrypoint: ['/bin/sh', '-c']
    command:
      - >-
        obclient -h oceanbase -P 2881 -u root@test -e
        "create database if not exists nocobase_collection_builder;
        create user if not exists 'nocobase'@'%' identified by 'nocobase';
        grant all privileges on nocobase_collection_builder.* to 'nocobase'@'%';"
