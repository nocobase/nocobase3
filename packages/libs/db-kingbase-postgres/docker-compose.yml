services:
  kingbase:
    image: registry.cn-shanghai.aliyuncs.com/nocobase/kingbase:v009r001c001b0030_single_x86
    platform: linux/amd64
    ports:
      - '0:54321'
    environment:
      ENABLE_CI: 'no'
      DB_USER: nocobase
      DB_PASSWORD: nocobase
      DB_MODE: pg
      NEED_START: 'yes'
    command: ['/usr/sbin/init']
    healthcheck:
      test: ['CMD-SHELL', 'bash -c "</dev/tcp/127.0.0.1/54321"']
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s
