services:
  redis:
    image: redis:7-alpine@sha256:e7723ff73d963f5cc6d9c4643ea3d989527a402a319239054e9472a7fb9219a2
    profiles: [redis]
    ports: ['127.0.0.1::6379']
    command:
      [
        'redis-server',
        '--save',
        '',
        '--appendonly',
        'no',
        '--maxmemory-policy',
        'noeviction',
      ]
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 1s
      timeout: 2s
      retries: 30
  cluster:
    image: redis:7-alpine@sha256:e7723ff73d963f5cc6d9c4643ea3d989527a402a319239054e9472a7fb9219a2
    profiles: [cluster]
    ports: ['127.0.0.1::7000', '127.0.0.1::7001', '127.0.0.1::7002']
    command:
      - sh
      - -ec
      - |
        for p in 7000 7001 7002; do
          mkdir -p /tmp/redis-$$p
          redis-server --port "$$p" --cluster-enabled yes --cluster-config-file /tmp/redis-$$p/nodes.conf --cluster-node-timeout 1000 --cluster-announce-ip 127.0.0.1 --cluster-announce-port "$$p" --save '' --appendonly no --maxmemory-policy noeviction --daemonize yes
        done
        for p in 7000 7001 7002; do
          attempts=0
          until redis-cli -p "$$p" ping; do
            attempts=$$((attempts + 1))
            test "$$attempts" -lt 30
            sleep 1
          done
        done
        redis-cli --cluster create 127.0.0.1:7000 127.0.0.1:7001 127.0.0.1:7002 --cluster-replicas 0 --cluster-yes
        exec sleep infinity
    healthcheck:
      test:
        [
          'CMD-SHELL',
          'redis-cli -p 7000 cluster info | grep -q cluster_state:ok',
        ]
      interval: 1s
      timeout: 2s
      retries: 30
