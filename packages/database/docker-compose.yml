services:
  postgres:
    image: postgres:16-alpine
    ports:
      - '15432:5432'
    environment:
      POSTGRES_USER: nocobase
      POSTGRES_PASSWORD: nocobase
      POSTGRES_DB: nocobase_collection_builder
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U nocobase -d nocobase_collection_builder']
      interval: 5s
      timeout: 5s
      retries: 20

  mysql:
    image: mysql:8.4
    ports:
      - '13306:3306'
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_USER: nocobase
      MYSQL_PASSWORD: nocobase
      MYSQL_DATABASE: nocobase_collection_builder
    healthcheck:
      test: ['CMD-SHELL', 'mysqladmin ping -h 127.0.0.1 -unocobase -pnocobase --silent']
      interval: 5s
      timeout: 5s
      retries: 30
