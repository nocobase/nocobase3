name: GitHub Release

# 为聚合 tag（release-beta/YYYY-MM-DD.N 或 release/YYYY-MM-DD.N）建 GitHub Release。
#
# 发版 commit 上挂着这批发布的全部信息：聚合 tag，以及 changeset publish 为每个
# **真正发布成功**的 package 打的 name@version tag。所以「发了哪些包」不需要另存
# 一份清单，`git tag --points-at` 读回来就是。
#
# 只读 git，不改任何东西。失败了重跑一次即可，也可以事后手动补建历史 release。
#
# 为什么是 workflow_call 而不是监听 push/tag：发版 workflow 用 GITHUB_TOKEN 推送，
# 而 GITHUB_TOKEN 推的 commit 和 tag 不会触发其它 workflow（GitHub 防死循环的设计）。
# 监听事件的话这里永远不会被触发，只能由发版 workflow 直接调用。

on:
  workflow_call:
    inputs:
      tag:
        description: 'Aggregate release tag'
        type: string
        required: true
  workflow_dispatch:
    inputs:
      tag:
        description: 'Aggregate release tag, e.g. release-beta/2026-08-26.5'
        type: string
        required: true

permissions:
  contents: write

jobs:
  publish:
    name: Publish the GitHub Release
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # 要 fetch-depth: 0 加 tag —— 渲染 release notes 要读 tag 指向的那个
      # commit 里的 CHANGELOG，浅克隆读不到。
      - name: Check out the repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Render the release notes
        env:
          TAG: ${{ inputs.tag }}
        run: |
          git fetch origin --tags --force
          if ! git rev-parse --verify --quiet "refs/tags/${TAG}^{commit}" > /dev/null; then
            echo "::error::Tag $TAG does not exist"
            exit 1
          fi
          node scripts/release-notes.mjs "$TAG" > /tmp/release-notes.md
          cat /tmp/release-notes.md

      # beta 标 prerelease 且不抢 GitHub Latest；stable 才是 Latest。
      # 已存在就更新 —— 重跑安全，事后补建也安全。
      - name: Create or update the GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ inputs.tag }}
        run: |
          case "$TAG" in
            release-beta/*) FLAGS=(--prerelease --latest=false) ;;
            release/*)      FLAGS=(--latest) ;;
            *)
              echo "::error::$TAG is not an aggregate release tag"
              exit 1
              ;;
          esac
          TITLE="${TAG##*/}"

          if gh release view "$TAG" > /dev/null 2>&1; then
            gh release edit "$TAG" \
              --title "$TITLE" \
              --notes-file /tmp/release-notes.md \
              "${FLAGS[@]}"
            echo "Updated GitHub Release $TAG"
          else
            gh release create "$TAG" \
              --verify-tag \
              --title "$TITLE" \
              --notes-file /tmp/release-notes.md \
              "${FLAGS[@]}"
            echo "Created GitHub Release $TAG"
          fi

      - name: Link the release in the job summary
        env:
          TAG: ${{ inputs.tag }}
        run: |
          {
            echo "### GitHub Release"
            echo
            echo "[$TAG](${{ github.server_url }}/${{ github.repository }}/releases/tag/$(node -e 'console.log(encodeURIComponent(process.argv[1]))' "$TAG"))"
          } >> "$GITHUB_STEP_SUMMARY"
