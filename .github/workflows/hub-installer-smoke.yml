name: Hub installer smoke test

# Installs, upgrades and rolls back the published Hub template with the hub-installer from this checkout, on the
# platform the Hub image uses.
# It also runs daily: the template ships no lockfile, so a newly published dependency can break an install with no
# change in this repository.

on:
  pull_request:
    paths:
      - 'packages/tools/hub-installer/**'
      - 'scripts/smoke-hub-installer.mjs'
      - '.github/workflows/hub-installer-smoke.yml'
  schedule:
    - cron: '0 3 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: hub-installer-smoke-${{ github.ref }}
  cancel-in-progress: true

jobs:
  smoke:
    name: Install a Hub on Debian bookworm
    runs-on: ubuntu-24.04
    container: node:24-bookworm
    timeout-minutes: 30
    env:
      HUB_ROOT: /tmp/hub
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up pnpm
        uses: pnpm/action-setup@v4

      - name: Install pm2
        run: npm install -g pm2

      - name: Install hub-installer dependencies
        run: pnpm install --frozen-lockfile --filter @nocobase/hub-installer

      # The same script backs `pnpm unreleased:hub-smoke`: install, check, upgrade from a copy registered as an older
      # release, roll back, check again.
      - name: Install, upgrade and roll back a Hub
        run: node scripts/smoke-hub-installer.mjs --root "$HUB_ROOT" --port 13000 -- node packages/tools/hub-installer/bin/run.js

      - name: Show Hub logs
        if: failure()
        run: |
          tail -n 200 "$HUB_ROOT"/logs/*.log || true
          pm2 logs --nostream --lines 100 || true
