name: Changeset Check

# 两层检查，严格程度不同：
#   validation —— 已提交的 changeset 本身有错（非法 YAML、未知包名、非法 bump）
#                 时阻止合并。这类问题机器能确定判断。
#   coverage   —— 改了会进入发布产物的代码却没写 changeset 时阻止合并。判断的是
#                 「改动会不会发出去」，不是「值不值得发版」；bump 级别仍由人定，
#                 确实不需要发版的改动加 `release:skip` label 放行。
#
# 这里不检查 .changeset/pre.json —— develop 常驻 pre 模式，它出现在指向
# develop 的 PR 里是正常的。保护 main 不被污染是 guard-main.yml 的职责，
# 那条只在目标分支为 main 的 PR 上运行。

on:
  pull_request:
    branches:
      - main
      - develop

permissions:
  contents: read
  pull-requests: write

jobs:
  check:
    name: Validate and require changesets
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.7.0
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Validate changeset files
        shell: bash
        run: node scripts/validate-changesets.mjs

      - name: Require a changeset for every changed package
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          SKIP_LABEL: ${{ contains(github.event.pull_request.labels.*.name, 'release:skip') }}
        run: node scripts/require-changesets.mjs
