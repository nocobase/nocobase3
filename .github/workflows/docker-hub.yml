name: Hub Docker image

on:
  workflow_call:
    inputs:
      create_app_version:
        description: 'Version or tag of @nocobase/create-app'
        type: string
        default: latest
      hub_template_version:
        description: 'Version or tag of @nocobase/app-template-hub'
        type: string
        default: latest
      image_tag:
        description: 'Image tag to publish to both GHCR and Alibaba Cloud'
        type: string
        default: latest
    secrets:
      ALI_DOCKER_REGISTRY:
        required: true
      ALI_DOCKER_USERNAME:
        required: true
      ALI_DOCKER_PASSWORD:
        required: true
  workflow_dispatch:
    inputs:
      create_app_version:
        description: 'Version or tag of @nocobase/create-app'
        type: string
        required: true
        default: latest
      hub_template_version:
        description: 'Version or tag of @nocobase/app-template-hub'
        type: string
        required: true
        default: latest
      image_tag:
        description: 'Image tag to publish to both GHCR and Alibaba Cloud'
        type: string
        required: true
        default: latest

permissions:
  contents: read

concurrency:
  group: docker-hub
  cancel-in-progress: false

jobs:
  image:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Check Alibaba Cloud credentials
        env:
          ALI_DOCKER_REGISTRY: ${{ secrets.ALI_DOCKER_REGISTRY }}
          ALI_DOCKER_USERNAME: ${{ secrets.ALI_DOCKER_USERNAME }}
          ALI_DOCKER_PASSWORD: ${{ secrets.ALI_DOCKER_PASSWORD }}
        run: |
          for name in ALI_DOCKER_REGISTRY ALI_DOCKER_USERNAME ALI_DOCKER_PASSWORD; do
            if [[ -z "${!name}" ]]; then
              echo "::error::Missing repository secret: $name"
              exit 1
            fi
          done

      - name: Set up QEMU for ARM64
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4
        with:
          platforms: arm64

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@594f3bf4285d9ea8dc53c9a0c9c4092420091003 # v4

      - name: Image metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6
        with:
          images: |
            ghcr.io/nocobase/hub
            registry.cn-beijing.aliyuncs.com/nocobase/hub
          flavor: latest=false
          tags: |
            type=raw,value=${{ inputs.image_tag }}
            type=raw,value=run-${{ github.run_id }}-${{ github.run_attempt }}

      # The image is started once on the runner before anything is pushed. Building it is not proof that it runs:
      # config resolution, the packaged native modules, and the pnpm start entry are only exercised by a container
      # that answers its health check. Only the runner's own platform is built here; the multi-arch build below
      # shares the amd64 layers through the cache.
      - name: Build Hub image for the runner platform
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          file: Dockerfile.hub
          platforms: linux/amd64
          load: true
          push: false
          provenance: false
          sbom: false
          tags: nocobase/hub:smoke
          build-args: |
            CREATE_APP_VERSION=${{ inputs.create_app_version }}
            HUB_TEMPLATE_VERSION=${{ inputs.hub_template_version }}
          # Every run must resolve moving registry tags again, including latest.
          no-cache-filters: build
          cache-from: type=gha,scope=hub-multiarch
          cache-to: type=gha,mode=max,scope=hub-multiarch

      - name: Smoke test the Hub image
        env:
          HUB_IMAGE: nocobase/hub:smoke
          HUB_PORT: '13000'
          TIMEOUT: '120'
        run: |
          set -euo pipefail
          SMOKE_DIR="$RUNNER_TEMP/hub-smoke"
          mkdir -p "$SMOKE_DIR/storage"
          cd "$SMOKE_DIR"

          # The same steps the deployment guide gives: take the example configuration from the image, replace the
          # placeholder secrets, and point the SQLite database at the persistent mount.
          docker run --rm --entrypoint cat "$HUB_IMAGE" /app/config.example.yml > config.example.yml
          test -s config.example.yml
          sed -e "s|replace-with-a-unique-secret|$(openssl rand -hex 32)|" \
              -e "s|^\([[:space:]]*\)database: hub/database/main.sqlite$|\1database: /data/hub/database/main.sqlite|" \
              config.example.yml > config.yml
          if grep -q 'replace-with-a-unique-secret' config.yml; then
            echo "::error::config.yml still carries a placeholder secret"
            exit 1
          fi
          # The image runs as the node user; the mounted storage has to be writable by it.
          chmod -R a+rwX storage

          cleanup() {
            echo "::group::Hub container logs"
            docker logs hub-smoke || true
            echo "::endgroup::"
            docker rm -f hub-smoke > /dev/null 2>&1 || true
          }
          trap cleanup EXIT

          docker run -d --name hub-smoke \
            -p "127.0.0.1:$HUB_PORT:13000" \
            -e APP_CONFIG_FILE=/app/config.yml \
            -e HUB_STORAGE_DIR=/data \
            -e APP_BASE_PATH=/hub \
            -e APP_PUBLIC_ORIGIN="http://127.0.0.1:$HUB_PORT" \
            -e APP_SERVER_HOST=0.0.0.0 \
            -e APP_SERVER_PORT=13000 \
            -v "$SMOKE_DIR/config.yml:/app/config.yml:ro" \
            -v "$SMOKE_DIR/storage:/data" \
            "$HUB_IMAGE"

          HEALTH_URL="http://127.0.0.1:$HUB_PORT/hub/api/healthz"
          echo "Waiting up to ${TIMEOUT}s for $HEALTH_URL"
          for _ in $(seq 1 "$TIMEOUT"); do
            if [ "$(docker inspect -f '{{.State.Running}}' hub-smoke 2>/dev/null)" != 'true' ]; then
              echo "::error::The Hub container exited before it became healthy"
              exit 1
            fi
            if curl -fsS --noproxy '*' --max-time 2 "$HEALTH_URL" -o health.json 2>/dev/null \
              && node -e 'const fs = require("node:fs"); process.exit(JSON.parse(fs.readFileSync(process.argv[1], "utf8")).ok === true ? 0 : 1)' health.json; then
              echo "Hub image answers $HEALTH_URL"
              exit 0
            fi
            sleep 1
          done

          echo "::error::The Hub image did not become healthy within ${TIMEOUT}s"
          exit 1

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Log in to Alibaba Cloud Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ${{ secrets.ALI_DOCKER_REGISTRY }}
          username: ${{ secrets.ALI_DOCKER_USERNAME }}
          password: ${{ secrets.ALI_DOCKER_PASSWORD }}

      - name: Build and push Hub image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          file: Dockerfile.hub
          platforms: linux/amd64,linux/arm64
          push: true
          # Alibaba Cloud rejects attestation manifests using application/vnd.oci.empty.v1+json.
          provenance: false
          sbom: false
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            CREATE_APP_VERSION=${{ inputs.create_app_version }}
            HUB_TEMPLATE_VERSION=${{ inputs.hub_template_version }}
          # Every run must resolve moving registry tags again, including latest.
          no-cache-filters: build
          cache-from: type=gha,scope=hub-multiarch
          cache-to: type=gha,mode=max,scope=hub-multiarch
