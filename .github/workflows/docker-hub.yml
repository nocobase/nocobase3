name: Hub Docker image

on:
  workflow_dispatch:
    inputs:
      create_app_version:
        description: 'Version or tag of @nocobase/create-app'
        type: string
        required: true
        default: latest
      hub_template_version:
        description: 'Version or tag of @nocobase/app-template-hub'
        type: string
        required: true
        default: latest
      image_tag:
        description: 'Image tag to publish to ghcr.io/nocobase/hub'
        type: string
        required: true
        default: latest

permissions:
  contents: read

concurrency:
  group: docker-hub
  cancel-in-progress: false

jobs:
  image:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Set up QEMU for ARM64
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4
        with:
          platforms: arm64

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@594f3bf4285d9ea8dc53c9a0c9c4092420091003 # v4

      - name: Image metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6
        with:
          images: ghcr.io/nocobase/hub
          flavor: latest=false
          tags: |
            type=raw,value=${{ inputs.image_tag }}
            type=raw,value=run-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Hub image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          file: Dockerfile.hub
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            CREATE_APP_VERSION=${{ inputs.create_app_version }}
            HUB_TEMPLATE_VERSION=${{ inputs.hub_template_version }}
          # A manual run must resolve moving registry tags again, including latest.
          no-cache-filters: build
          cache-from: type=gha,scope=hub-multiarch
          cache-to: type=gha,mode=max,scope=hub-multiarch
