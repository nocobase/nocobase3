# Hub settings for the Compose playground, mounted at /app/config.yml.
# AUTH_SECRET, SESSION_SECRET, and APP_PUBLIC_ORIGIN come from .env through Compose.
# Keep credentials out of this committed file.

client:
  app:
    title: NocoBase Hub
    # defaultColorScheme: system # light | dark | system
    # defaultTheme: compact

# i18n:
#   defaultLocale: zh-CN

auth:
  emailAndPassword:
    enabled: true
    autoSignIn: false
    disableSignUp: true
  session:
    storeSessionInDatabase: true

database:
  default: main
  connections:
    main:
      dialect: sqlite
      filename: /app/dist/storage/database.sqlite
      debug: false
      schemaManagement: managed
      migrations:
        autoRun: true
      seeds:
        autoRun: true

snowflake:
  # Assign a distinct workerId to each concurrently running instance.
  workerId: 0
  epoch: 1605024000
