# Run from playground/ so its .env stays separate from application development.
name: nocobase-hub

services:
  hub:
    image: ${NOCOBASE_IMAGE:-ghcr.io/nocobase/hub:latest}
    restart: unless-stopped
    stop_grace_period: 30s
    ports:
      - '${NOCOBASE_BIND_HOST:-127.0.0.1}:${NOCOBASE_PORT:-13000}:13000'
    environment:
      APP_CONFIG_FILE: /app/config.yml
      AUTH_SECRET: ${AUTH_SECRET:?Set AUTH_SECRET in .env}
      SESSION_SECRET: ${SESSION_SECRET:?Set SESSION_SECRET in .env}
      APP_PUBLIC_ORIGIN: ${APP_PUBLIC_ORIGIN:-http://localhost:13000}
    volumes:
      - type: bind
        source: ./config.yml
        target: /app/config.yml
        read_only: true
        bind:
          create_host_path: false
      - hub_data:/app/dist/storage
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - >-
          fetch('http://127.0.0.1:13000' + (process.env.APP_BASE_PATH || '') + '/api/healthz',
          {signal: AbortSignal.timeout(3000)})
          .then(async response => process.exit(response.ok && (await response.json()).ok === true ? 0 : 1))
          .catch(() => process.exit(1))
      interval: 30s
      timeout: 5s
      start_period: 60s
      retries: 3

volumes:
  hub_data:
